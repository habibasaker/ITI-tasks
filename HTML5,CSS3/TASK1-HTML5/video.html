<html>
    <head>
        <title>HTML 5 TASK1</title>
    </head>
    <body>
        <h1>frozen</h1>
        <video id="myvideo" src="/downloads/frozen.mp4" poster="/downloads/frozen_Poster.jpg">your source dont support this video</video>

        <br>
        <input type="button" value="play" id="playbtn">
        <input type="button" value="pause" id="pausebtn">
        <input type="button" value="+5" id="skip5btn">
        <input type="button" value="+10" id="skip10btn">
        <input type="button" value="-5" id="minus5btn">
        <input type="button" value="-10" id="minus10btn">
        <input type="button" value="mute" id="mutebtn">

        <!-- SPEED-->
         <select id="speedlist">
            <option value="0.5">0.5x</option>
            <option value="1">1x</option>
            <option value="1.5">1.5x</option>
            <option value="2.0">2.0x</option>
         </select>

         <!--VOLUME-->
         <input type="range" id="volumebar" min="0" max="1" step="0.1" value="1">

         <!-- curent time-->
        <span id="currentTime">0</span>

                <!-- progress bar of the video -->
         <br><br>
         <input type="range"id="progressBar"min="0"value="0">
        <script src="video.js"></script>

       
        
    </body>
</html>

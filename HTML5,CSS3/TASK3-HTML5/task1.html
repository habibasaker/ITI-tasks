<html>
    <head>
        <title>WEB VALIDATION FORM</title>
        <link rel="stylesheet" href="style1.css">
    </head>
    <body>
        <form>
            <h2> change email address</h2>
            <label>USERNAME</label>
            <br>
            <input type="text" placeholder="username" name="username" required pattern="[a-zA-Z]+">
            <p class="note"> the required username may only be a series of alphabetical characters </p>
            <br>
            <label>email</label>
            <br>
            <input type="email" placeholder="name@gmail.com" name="email" required >
            <p class="note"> the email may not include any special characters other than '@' sign </p>
            <br>
            <input type="submit" value="change">
        </form>
    </body>
    

</html>

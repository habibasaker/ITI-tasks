
<html>
<head>

    <title>Login Form</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Login Page</h1>

    <form action="page2.html" method="get">

        <fieldset>
            <legend>Login Form</legend>

            <table>

                <tr>
                    <td>
                        <label for="username" accesskey="u">
                            User Name:
                        </label>
                    </td>

                    <td>
                        <input type="text" id="username" name="username" accesskey="u" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="password" accesskey="p">
                            Password:
                        </label>
                    </td>

                    <td>
                        <input type="password" id="password" name="password" accesskey="p" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="remember">
                            Remember Me
                        </label>
                    </td>

                    <td>
                        <input type="checkbox" id="remember" name="remember" accesskey="r">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" style="text-align:center;">
                        <input type="submit" value="Login" accesskey="l">

                        <input type="reset" value="Reset" accesskey="e">
                    </td>
                </tr>

            </table>

        </fieldset>

    </form>

</body>
</html>

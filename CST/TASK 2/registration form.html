<html>
    <head>
        <title>registration form</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <form action="login form.html" method="get">
            <caption>Registration Form</caption>
        <table>
            <tr>
                <td><label for="fname">first name</label></td>
                <td><input type="text" id="fname" name="fname"></td>

            </tr>   
            <tr>
                <td><label for="lname">last name</label></td>
                <td><input type="text" id="lname" name="lname"></td>
            </tr>
            <tr>
                <td><label for="em">email</label></td>
                <td><input type="em" id="em" name="em"></td>
            </tr>

            <tr>
                <td><label for="pass">password</label></td>
                <td><input type="pass" id="pass" name="pass"></td>
            </tr>
            <tr>
                <td>gendre<td>
                <td><input type="radio" id="male" name="gender" value="Male">
                    <label for="male">male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">female</label>
                </td>
            </tr>
            <tr>
                <td><label for="country">Country</label></td>
                <td>
                    <select id="country" name="country">

                        <optgroup label="africa">
                            <option>egypt</option>
                            <option>algeria</option>
                        </optgroup>

                        <optgroup label="asia">
                            <option>saudi arabia</option>
                        </optgroup>

                        <optgroup label="Europe">
                            <option>german</option>
                            <option>franse</option>

                        </optgroup>

                    </select>
                </td>
            </tr>
            <tr>
                <td>B-day</td>
                <td>

                    <select name="month">
                        <option>jan</option>
                        <option>feb</option>
                        <option>mar</option>
                        <option>aril</option>
                        <option>may</option>
                        <option>jun</option>
                        <option>jul</option>
                        <option>aug</option>
                        <option>sept</option>
                        <option>oct</option>
                        <option>nov</option>
                        <option>dec</option>
                    </select>

                    <input type="number" name="day" min="1" max="31">

                    <input type="number" name="year" min="1900" max="2026">

                </td>
            </tr>
            <tr>
                <td>Interests</td>
                <td>
                    <input type="checkbox" id="sports" name="interest" value="Sports">
                    <label for="sports">Sports</label>

                    <input type="checkbox" id="music" name="interest" value="Music">
                    <label for="music">Music</label>

                    <input type="checkbox" id="reading" name="interest" value="Reading">
                    <label for="reading">Reading Books</label>
                </td>
            </tr>
            <tr>
                <td><label for="bio">Bio</label></td>
                <td>
                    <textarea id="bio" name="bio"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="regestir">
                    <input type="reset" value="reset">
                </td>
            </tr>
        </table>    
        </form>
    </body>
    
</html>
